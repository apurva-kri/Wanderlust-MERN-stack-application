  #     - database
  #   healthcheck:
  #     test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]    #spider check the URL w/o downloadig response body
  #     interval: 10s
  #     timeout: 5s
  #     retries: 3
  #     start_period: 40s

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:80/"]
      interval: 10s
      retries: 3
      timeout: 5s
      start_period: 40s

    depends_on: 
      - backend
    ports:
      - "81:80"


networks:
  monitoring:

volumes:
  mongo_volume: