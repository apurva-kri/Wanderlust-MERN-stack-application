  #     MONGO_HOST: database
  #     MONGO_PORT: 27017
  #     MONGO_USERNAME: devroot
  #     MONGO_PASSWORD: devpassword
  #     MONGO_DATABASE: app_db
  #     MONGODB_URI: ${MONGODB_URI}
  #     REDIS_URL: ${REDIS_URL}
