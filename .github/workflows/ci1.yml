name: ci
on:
  push:
    branches:
      - master

jobs:
  build-test-fe:
    runs-on: ubuntu-latest

    # startegy:
    #   matrix:
    #     wor_directory: [frontend, backend]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup nodejs
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false # Disable automatic npm caching if not required

      - name: clean install
        run: npm ci

      - name: lint the code
        run: npm run lint

      - name: run test
        run: npm run test

      - name: build npm
        run: npm run build

  build-test-be:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: node setup
        uses: actions/setup-node@v7

        with:
          node-version: 20
          package-manager-cache: false

      - name: npm install
        run: npm ci

      - name: test code
        run: npm run test

      - name: prettier check 
        run: npm run check

      - name: npm build
        run: npm run build




      
